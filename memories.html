<!doctype html>
<html lang="th">
  <head>
    <!-- ส่วนหัว (Head) - ตั้งค่าฟอนต์, meta, ลิงก์ CSS -->
    <!--
      Head section for Our Memories page
      - Reuses shared font and stylesheet
      - Keeps responsive viewport for mobile‑first design
    -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Our Memories | Ghim &amp; Tonkla - Personal Website</title>
    <meta
      name="description"
      content="เว็บไซต์บันทึกความทรงจำของกิมและต้นกล้า"
    />

    <!-- Google Fonts: Sarabun (primary Thai font) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Preload & global pastel stylesheet -->
    <link rel="preload" href="./css/style.css" as="style" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <!-- เริ่มต้นเนื้อหาเว็บ Memories -->
    <!--
      Page wrapper for sticky header + footer at bottom.
      Content stays linear and readable even without CSS or JS.
    -->
    <div class="page-wrapper">
      <!-- Section: Header (เมนูนำทางด้านบน) -->
      <!-- Shared header & navigation with active state on "Our Memories" -->
      <header class="site-header">
        <!-- Navbar + โลโก้ + เมนู -->
        <div class="container navbar" aria-label="Main navigation">
          <!-- Brand / logo area -->
          <a href="index.html" class="navbar__brand">
            <span class="navbar__brand-icon" aria-hidden="true">❤</span>
            <span>G &amp; T</span>
          </a>

          <!-- Hamburger toggle for mobile navigation -->
          <button
            class="navbar-toggle"
            type="button"
            aria-label="เปิดเมนูนำทาง"
            aria-expanded="false"
          >
            <span class="navbar-toggle__icon" aria-hidden="true">
              <span></span>
              <span></span>
              <span></span>
            </span>
          </button>

          <!-- Primary navigation links -->
          <nav aria-label="Primary">
            <ul class="navbar__links">
              <li>
                <a href="index.html" class="navbar__link">Home</a>
              </li>
              <li>
                <a href="ghim-cv.html" class="navbar__link">Ghim's CV</a>
              </li>
              <li>
                <a href="jigsaw-game.html" class="navbar__link">Jigsaw Game</a>
              </li>
              <li>
                <a
                  href="memories.html"
                  class="navbar__link navbar__link--active"
                  aria-current="page"
                  >Our Memories</a
                >
              </li>
              <li>
                <a href="anniversary.html" class="navbar__link">Anniversary</a>
              </li>
            </ul>
          </nav>
        </div>
      </header>

      <!-- Section: Main Content (แกลลอรีโพลารอยด์) -->
      <main class="main" id="main-content">
        <section class="section" aria-labelledby="memories-heading">
          <div class="container">
            <!-- หัวข้อหลักของหน้า Memories -->
            <header class="section-heading">
              <p class="section-heading__eyebrow">
                <span aria-hidden="true">📸</span>
                <span>Polaroid Memory Gallery</span>
              </p>
              <h1 id="memories-heading" class="section-heading__title">
                Our Memories
              </h1>
              <p class="section-heading__subtitle">
                เก็บช่วงเวลาน่ารัก ๆ ของเราผ่านรูปโพลารอยด์ใบเล็ก ๆ แทนคำพูดยาว ๆ
              </p>
            </header>

            <!-- Polaroid Gallery: รวมความทรงจำ -->
            <div
              class="polaroid-grid"
              aria-label="Polaroid gallery of our memories"
            >
              <!-- Card 1 -->
              <article class="polaroid-card polaroid-card--tilt-left">
                <figure class="polaroid-card__frame">
                  <img
                    src="images/memory-1.jpg"
                    alt="ดูคอนเสิร์ต Cocktail"
                    class="polaroid-card__image"
                    width="200"
                    height="200"
                    decoding="async"
                    fetchpriority="high"
                  />
                  <figcaption class="polaroid-card__caption">
                    คอนเสิร์ต Cocktail 🎵 ร้องเพลงโปรดไปด้วยกันสุดเสียง
                  </figcaption>
                </figure>
              </article>

              <!-- Card 2 -->
              <article class="polaroid-card polaroid-card--tilt-right">
                <figure class="polaroid-card__frame">
                  <img
                    src="images/memory-2.jpg"
                    alt="เที่ยวคริสต์มาส"
                    class="polaroid-card__image"
                    width="200"
                    height="200"
                    decoding="async"
                    fetchpriority="high"
                  />
                  <figcaption class="polaroid-card__caption">
                    เทศกาลคริสต์มาส 🎄 เดินดูไฟและบรรยากาศดีๆ ด้วยกัน
                  </figcaption>
                </figure>
              </article>

              <!-- Card 3 -->
              <article class="polaroid-card polaroid-card--tilt-left">
                <figure class="polaroid-card__frame">
                  <img
                    src="images/memory-3.jpg"
                    alt="ออกกำลังกายด้วยกัน"
                    class="polaroid-card__image"
                    width="200"
                    height="200"
                    loading="lazy"
                    decoding="async"
                  />
                  <figcaption class="polaroid-card__caption">
                    วันไปออกกำลังกาย 🏃‍♀️🏃‍♂️ เหนื่อยแค่ไหนก็มีคนข้างๆ
                  </figcaption>
                </figure>
              </article>

              <!-- Card 4 -->
              <article class="polaroid-card polaroid-card--tilt-right">
                <figure class="polaroid-card__frame">
                  <img
                    src="images/memory-4.jpg"
                    alt="เที่ยวทะเล"
                    class="polaroid-card__image"
                    width="200"
                    height="200"
                    loading="lazy"
                    decoding="async"
                  />
                  <figcaption class="polaroid-card__caption">
                    ทริปเที่ยวทะเล 🌊 ฟังเสียงคลื่นและเสียงหัวใจ
                  </figcaption>
                </figure>
              </article>

            </div>
          </div>
        </section>
      </main>

      <!-- Section: Footer (ปิดท้ายเว็บ) -->
      <footer class="site-footer">
        <div class="container site-footer__inner">
          <p>
            Made with <span class="site-footer__heart" aria-hidden="true">❤</span>
            by Ghim &amp; Tonkla
          </p>
          <p class="text-soft">Together since July 26, 2022</p>
        </div>
      </footer>
    </div>

    <!-- Shared navigation toggle script -->
    <script src="js/script.js" defer></script>
  </body>
</html>
