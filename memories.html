    <!--
      Progressive enhancement: Intersection Observer scroll animation
      - If JS or IntersectionObserver is not available, all cards stay visible.
      - When supported, we add a .js class to <body> and animate
        each .fade-in-up card when it enters the viewport.
    -->
    <script>
      (function () {
        // Guard: if browser doesn't support IntersectionObserver, exit early
        if (!('IntersectionObserver' in window)) {
          return;
        }

        // Mark that JavaScript is active so CSS can safely hide .fade-in-up
        document.body.classList.add('js');

        // Select all memory cards that should animate on scroll
        var cards = document.querySelectorAll('[data-memory-observe]');
        if (!cards.length) return;

        // Create an observer with a slightly earlier trigger (0.15 of the card in view)
        var observer = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                // Add .is-visible so CSS plays fade-in / slide-up animation
                entry.target.classList.add('is-visible');
                // Once animated, we no longer need to observe this element
                observer.unobserve(entry.target);
              }
            });
          },
          {
            threshold: 0.15,
          }
        );

        // Attach the observer to each card
        cards.forEach(function (card) {
          observer.observe(card);
        });
      })();
    </script>
